version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: afristay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: afristay
      POSTGRES_PASSWORD: afristay_dev_2025
      POSTGRES_DB: afristay
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: afristay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: